services:
  - type: web
    name: liwec
    env: python
    region: oregon          # pick the Render region closest to your Supabase project's region
    plan: starter           # free plan has no persistent disk — see RECORDINGS_DIR note below
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class gthread --threads 4 --timeout 120 -w 1 --bind 0.0.0.0:$PORT app:app"
    # Runs once per deploy, after build, before traffic is switched over.
    # db.create_all() is idempotent, so this is safe to run on every deploy.
    preDeployCommand: "flask --app app init-db"
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render generates and stores a random secret for you
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        sync: false               # set manually in the Render dashboard — see note below
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: RECORDINGS_DIR
        value: /var/data/recordings
      - key: VERIFICATION_DOCS_DIR
        value: /var/data/verification_docs   # consultant ID/certificate uploads — sensitive, never publicly served
    disk:
      name: recordings
      mountPath: /var/data
      sizeGB: 2                   # bumped from 1GB — now also holds verification document uploads

