{% extends "base.html" %}
{% block title %}Log in · ConsultMeet{% endblock %}
{% block page_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card">
  <span class="auth-eyebrow">ConsultMeet</span>
  <h1>Welcome back</h1>
  <p class="sub">Log in to host or join a consultation.</p>

  <form method="POST">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>

  <p class="auth-switch">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
</div>
{% endblock %}
