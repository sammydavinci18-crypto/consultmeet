{% extends "base.html" %}
{% block title %}Create account · Liwec{% endblock %}
{% block page_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card">
  <span class="auth-eyebrow">Liwec</span>
  <h1>Create your account</h1>
  <p class="sub">Set up consultations and invite the people you meet with.</p>

  <form method="POST">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required autofocus>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>
    <div class="field">
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>

  <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
